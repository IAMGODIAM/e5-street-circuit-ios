workflows:
  street-circuit-adhoc:
    name: E5 Street Circuit — Ad Hoc
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
        - circuit_ota
      node: 22
      xcode: 26.4
      vars:
        BUNDLE_ID: com.e5enclave.streetcircuit
    scripts:
      - name: Install and verify immutable release
        script: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Sync committed native project
        script: |
          npm run ios:sync
          npm run verify:native
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}" bash scripts/patch_ios.sh
      - name: Install Ad Hoc signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
      - name: Publish optional OTA mirror
        script: |
          if [ -n "${IPA_PUT_URL:-}" ]; then
            IPA_PATH=$(find build/ios/ipa -name '*.ipa' -type f -print -quit)
            test -n "$IPA_PATH"
            curl -fsS -X PUT --upload-file "$IPA_PATH" "$IPA_PUT_URL"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  street-circuit-testflight:
    name: E5 Street Circuit — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      node: 22
      xcode: 26.4
      vars:
        BUNDLE_ID: com.e5enclave.streetcircuit
    scripts:
      - name: Install and verify immutable release
        script: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Sync committed native project
        script: |
          npm run ios:sync
          npm run verify:native
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-1}" bash scripts/patch_ios.sh
      - name: Install App Store signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
